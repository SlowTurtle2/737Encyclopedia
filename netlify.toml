[build]
  command = "pnpm build:netlify"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11.19.0"
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
